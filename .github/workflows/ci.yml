name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      # The suite mocks every outbound call, so this needs no secrets and
      # cannot be broken by a third-party API having a bad morning.
      - name: Test
        run: uv run pytest -q

      # Both rule sets are scored against hand labels on every commit; a
      # regression in either is a failed build, not something noticed in a month.
      - name: Score the rules against hand labels
        run: uv run papertrail audit --min-accuracy 1.0
