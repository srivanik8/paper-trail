[project]
name = "papertrail"
version = "0.1.0"
description = "AI news, filtered by whether it can show its work."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.2.0",
    "httpx>=0.27",
    "pydantic>=2.13.5",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
papertrail = "papertrail.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papertrail"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
